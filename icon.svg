<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方框 -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- 终端/代码符号 ">_" -->
  <text x="64" y="58" font-family="monospace" font-size="48" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">&gt;_</text>
  
  <!-- 下方的文字 "A"（Agenteam）-->
  <text x="64" y="92" font-family="sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="central">A</text>
  
  <!-- 小装饰点 -->
  <circle cx="18" cy="18" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="110" cy="18" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="18" cy="110" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="110" cy="110" r="3" fill="rgba(255,255,255,0.4)"/>
</svg>
